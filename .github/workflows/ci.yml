name: CI

# Runs only as part of a release (called from release.yml) or by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  rust-lint:
    name: Rust fmt + clippy + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and arm64: some code (and its tests) is compiled only on x86_64
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/geatpy_core
      - run: cargo fmt --manifest-path crates/geatpy_core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path crates/geatpy_core/Cargo.toml --release --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/geatpy_core/Cargo.toml --release --lib

  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t"]

    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/geatpy_core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest numpy matplotlib scipy

      - name: Build and install Geatpy (Rust Core)
        run: |
          python scripts/build.py --install

      - name: Run pytest test suite
        run: |
          pytest tests -v
