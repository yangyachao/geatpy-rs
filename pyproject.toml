[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "geatpy-rs"
version = "2.8.0b2"
description = "The Genetic and Evolutionary Algorithm Toolbox for Python with High-Performance Rust Core"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "LGPL-3.0" }
authors = [
    { name = "yangyachao", email = "yangyachao@live.cn" },
    { name = "Geatpy Development Team" }
]
maintainers = [
    { name = "yangyachao", email = "yangyachao@live.cn" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.17.0",
    "matplotlib>=3.0.0",
    "scipy>=1.0.0",
]

[project.urls]
Homepage = "https://www.yangyachao.com"
Repository = "https://github.com/yangyachao/geatpy-rs"
Issues = "https://github.com/yangyachao/geatpy-rs/issues"

[tool.maturin]
manifest-path = "crates/geatpy_core/Cargo.toml"
module-name = "_geatpy_core"
python-packages = ["geatpy"]
# The crate lives in crates/geatpy_core, so the root LICENSE (declared as License-File in the
# metadata) has to be added to the sdist explicitly; PyPI rejects an sdist without it.
include = [{ path = "LICENSE", format = "sdist" }]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.8.0b2"
tag_format = "v$version"
version_files = ["pyproject.toml:version","setup.py:version","geatpy/__init__.py:version"]

[tool.yapf]
based_on_style = "pep8"
split_before_arithmetic_operator = true
split_before_named_assigns = false
indent_dictionary_value = true
split_all_top_level_comma_separated_values = true

[tool.isort]
profile = "google"
