[package]
name = "geatpy-core"
version = "2.8.0-beta.2"
edition = "2021"
authors = ["yangyachao <yangyachao@live.cn>"]
homepage = "https://www.yangyachao.com"
repository = "https://github.com/yangyachao/geatpy-rs"
description = "High-performance Rust implementation of Geatpy core operators"
license = "LGPL-3.0"

[lib]
name = "_geatpy_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# One cp38-abi3 wheel for every CPython with a GIL. Free-threaded CPython (3.14t+) has no stable
# ABI: built there, PyO3 falls back to a wheel for that version (cp314t).
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
numpy = "0.29"
ndarray = "0.16"
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"
rayon = "1.10"

